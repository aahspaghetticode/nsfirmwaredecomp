
<!DOCTYPE html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
<style>
body,
main,
h1,
p {
  margin: 0;
  padding: 0;
  font-weight: normal;
  text-align: left;
}

body {
  padding: 0 28px;
  text-align: center;
}

p {
  word-wrap: break-word;
}

body {
  background: rgb(248, 248, 248);
}

.text {
  color: rgb(160, 160, 160);
}

@supports (color-scheme: dark) {
  @media (prefers-color-scheme: dark) {
    body {
      background: rgb(56, 56, 56);
    }

    .text {
      color: rgb(157, 157, 157);
    }
  }
}

@media screen and (max-height: 200px) {
  main {
    padding-top: 20px;
  }

  h1 {
    font-size: 12px;
  }

  p {
    margin-top: 5px;
    line-height: 24px;
    font-size: 16px;
  }
}

@media screen and (min-height: 200px) {
  main {
    padding-top: 50px;
  }

  h1 {
    font-size: 14px;
  }

  p {
    margin-top: 15px;
    line-height: 21px;
    font-size: 20px;
  }
}

nobr {
  display: inline;
  white-space: nowrap;
}
</style>
<main>
  <h1 class="text">%s</h1>
  <p class="text">%s
</main>
