<!doctype html>

<html lang="ja-JP">
<head>
  <meta charset="utf-8" />
  <title>警告表示の意味</title>
  <link rel="stylesheet" href="../../css/common_style.css" />
  <meta name="viewport" content="user-scalable=no" />
  <meta name="focus-ring-visibility" content="hidden">
  <script type="text/javascript">
    window.nx.footer.unsetAssign('x');
    window.nx.footer.unsetAssign('a');
  </script>
</head>
<body>
<div class="main">
  <h1 class="page-title"><span data-msgid="textbox_id-1">警告表示の意味</span></h1>
  <div class="box">
    <p><span data-msgid="textbox_id-2">次の警告表示は、注意事項を守らなかった場合に起こる事故の程度を表します。内容をご理解のうえ、注意事項をお読みください。</span></p>
    <ul class="rect">
      <li>
        <h2 class="section-title danger exclamation"><span data-msgid="textbox_id-3">危険</span></h2>
        <p><span data-msgid="textbox_id-4">死亡や重傷を負う原因になる可能性が高いもの</span></p>
      </li>
      <li>
        <h2 class="section-title warning exclamation"><span data-msgid="textbox_id-5">警告</span></h2>
        <p><span data-msgid="textbox_id-6">死亡や重傷など、人身事故の原因になる可能性があるもの</span></p>
      </li>
      <li>
        <h2 class="section-title attention exclamation"><span data-msgid="textbox_id-7">注意</span></h2>
        <p><span data-msgid="textbox_id-8">けがをしたり、家財に損害を与えたりする可能性があるもの</span></p>
      </li>
      <li>
        <h2 class="section-title please"><span data-msgid="textbox_id-9">使用上のお願い</span></h2>
        <p><span data-msgid="textbox_id-10">機器が破損したり、家財に損害を与えたりする可能性があるもの</span></p>
      </li>
    </ul>
    <p><span data-msgid="textbox_id-11">次の記号は、注意事項の内容を表します。</span></p>
    <ul class="rect icon-list">
      <li class="icon-name ban">
        <span><span data-msgid="textbox_id-12">禁止</span></span>
      </li>
      <li class="icon-name instruct">
        <span><span data-msgid="textbox_id-13">指示</span></span>
      </li>
    </ul>
  </div>
</div>

<!-- textbox_id_counter-13 common_idbase-20000 --></body>
</html>
