<!doctype html>

<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <title>警告標記的含意</title>
  <link rel="stylesheet" href="../../css/common_style.css" />
  <meta name="viewport" content="user-scalable=no" />
  <meta name="focus-ring-visibility" content="hidden">
  <script type="text/javascript">
    window.nx.footer.unsetAssign('x');
    window.nx.footer.unsetAssign('a');
  </script>
</head>
<body>
<div class="main">
  <h1 class="page-title"><span data-msgid="textbox_id-1">警告標記的含意</span></h1>
  <div class="box">
    <p><span data-msgid="textbox_id-2">下列警告標記用以表示假如沒有遵守該注意事項時將可能發生的意外之嚴重程度。請充分理解下述內容後閱覽注意事項。</span></p>
    <ul class="rect">
      <li>
        <h2 class="section-title danger exclamation"><span data-msgid="textbox_id-3">危險</span></h2>
        <p><span data-msgid="textbox_id-4">導致重傷甚至死亡的可能性很高</span></p>
      </li>
      <li>
        <h2 class="section-title warning exclamation"><span data-msgid="textbox_id-5">警告</span></h2>
        <p><span data-msgid="textbox_id-6">可能會導致重傷或死亡等人身傷亡</span></p>
      </li>
      <li>
        <h2 class="section-title attention exclamation"><span data-msgid="textbox_id-7">注意</span></h2>
        <p><span data-msgid="textbox_id-8">可能會導致受傷或損壞家庭財產</span></p>
      </li>
      <li>
        <h2 class="section-title please"><span data-msgid="textbox_id-9">使用須知</span></h2>
        <p><span data-msgid="textbox_id-10">可能會導致機器故障或損壞家庭財產</span></p>
      </li>
    </ul>
    <p><span data-msgid="textbox_id-11">下列標記表示注意事項的內容。</span></p>
    <ul class="rect icon-list">
      <li class="icon-name ban">
        <span><span data-msgid="textbox_id-12">禁止事項</span></span>
      </li>
      <li class="icon-name instruct">
        <span><span data-msgid="textbox_id-13">建議事項</span></span>
      </li>
    </ul>
  </div>
</div>
